name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PyInstaller onefile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller
          python -m pip install resvg-py
          python -c "import resvg_py; print('resvg renderer bundled')"

      - name: Build
        shell: pwsh
        run: |
          $flags = @(
            "--onefile",
            "--windowed",
            "--clean",
            "--noconfirm",
            "--name", "logos_tool",
            "--collect-all", "resvg_py"
          )
          python -m PyInstaller @flags gui.py

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = ".\dist\logos_tool.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "logos_tool.exe exited immediately with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "exe stayed alive, so tkinter is bundled correctly"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logos_tool-windows
          path: |
            dist/logos_tool.exe
            logos_tool.spec

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          files: dist/logos_tool.exe
          generate_release_notes: true
